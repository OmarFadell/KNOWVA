# yaml-language-server: $schema=https://aka.ms/m365-agents-toolkits/v1.11/yaml.schema.json
version: v1.11

environmentFolderPath: ./env

provision:
  - uses: teamsApp/create
    with:
      name: KNOWVA${{APP_NAME_SUFFIX}}
    writeToEnvironmentFile:
      teamsAppId: TEAMS_APP_ID

  # Create or reuse the Entra application backing the bot.
  # Single-tenant for now. To go multi-tenant later see SETUP.md.
  - uses: aadApp/create
    with:
      name: KNOWVA${{APP_NAME_SUFFIX}}
      generateClientSecret: true
      generateServicePrincipal: true
      signInAudience: AzureADMyOrg
    writeToEnvironmentFile:
      clientId: BOT_ID
      clientSecret: SECRET_BOT_PASSWORD
      objectId: BOT_OBJECT_ID
      tenantId: AAD_APP_TENANT_ID

  # Apply the SSO scope (access_as_user), identifierUris, and Teams client
  # pre-authorization from aad.manifest.json onto the Entra app created above.
  - uses: aadApp/update
    with:
      manifestPath: ./aad.manifest.json
      outputFilePath: ./build/aad.manifest.${{TEAMSFX_ENV}}.json

  # Replaces the template's botFramework/create.
  # A dev.botframework.com registration cannot carry an OAuth connection
  # setting, so local uses a real Azure Bot resource -- same as dev.
  # This redeploys every provision, so the messaging endpoint always tracks
  # the current dev tunnel host.
  - uses: arm/deploy
    with:
      subscriptionId: ${{AZURE_SUBSCRIPTION_ID}}
      resourceGroupName: ${{AZURE_RESOURCE_GROUP_NAME}}
      templates:
        - path: ./infra/local.bicep
          parameters: ./infra/local.parameters.json
          deploymentName: Create-local-bot

  - uses: teamsApp/zipAppPackage
    with:
      manifestPath: ./appPackage/manifest.json
      outputZipPath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip
      outputFolder: ./appPackage/build

  - uses: teamsApp/validateAppPackage
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  - uses: teamsApp/update
    with:
      appPackagePath: ./appPackage/build/appPackage.${{TEAMSFX_ENV}}.zip

  # Fail loudly if the artifacts we think exist do not.
  # This is the gate that would have caught the last build's silent half-provision.
  - uses: script
    name: verify provision
    with:
      run: pwsh -File ./scripts/verify-provision.ps1 -BotId "${{BOT_ID}}" -ResourceGroup "${{AZURE_RESOURCE_GROUP_NAME}}" -ConnectionName "graph"

deploy:
  - uses: cli/runNpmCommand
    name: install dependencies
    with:
      args: install

  - uses: file/createOrUpdateEnvironmentFile
    with:
      target: ./.localConfigs
      envs:
        PORT: 3978
        CLIENT_ID: ${{BOT_ID}}
        CLIENT_SECRET: ${{SECRET_BOT_PASSWORD}}
        TENANT_ID: ${{AAD_APP_TENANT_ID}}
        BOT_TYPE: SingleTenant
        AAD_APP_OAUTH_CONNECTION_NAME: graph
        # Decrypted from env/.env.local.user and written into .localConfigs,
        # which is gitignored. config.ts refuses to start without it.
        ANTHROPIC_API_KEY: ${{SECRET_ANTHROPIC_API_KEY}}
        # SharePoint site the search_documents tool is scoped to. Not a secret;
        # set in env/.env.local. config.ts refuses to start without it.
        SHAREPOINT_SITE_URL: ${{SHAREPOINT_SITE_URL}}
        # Optional. "Display Name=address@domain" pairs separated by ";".
        # Empty means search_emails can only reach the asking user's own mailbox,
        # which is the intended default.
        SHARED_MAILBOXES: ""
        # Used by search_conversations to filter /me/chats down to the chats
        # Knowva is installed in. Written by teamsApp/create above.
        TEAMS_APP_ID: ${{TEAMS_APP_ID}}
        # GitHub App credentials for search_github. Decrypted from
        # env/.env.local.user. Empty is fine -- the tool then reports itself
        # unavailable instead of the app refusing to start.
        GITHUB_CLIENT_ID: ${{SECRET_GITHUB_CLIENT_ID}}
        GITHUB_CLIENT_SECRET: ${{SECRET_GITHUB_CLIENT_SECRET}}
        # PARKED. Credentials for the per-user Atlassian OAuth flow in
        # src/auth/atlassian.ts, which app.ts does not currently mount -- the
        # Xray milestone is org-scoped. Carried through so reviving it needs no
        # plumbing change; empty values are expected and harmless.
        ATLASSIAN_CLIENT_ID: ${{SECRET_ATLASSIAN_CLIENT_ID}}
        ATLASSIAN_CLIENT_SECRET: ${{SECRET_ATLASSIAN_CLIENT_SECRET}}
        # Xray Cloud API key. ONE SHARED SERVICE CREDENTIAL for the whole
        # deployment, not per user -- Xray Cloud has no per-user auth model at
        # all. The id half is plain config in env/.env.local; the secret half is
        # decrypted from env/.env.local.user. See src/xray/client.ts.
        XRAY_CLIENT_ID: ${{XRAY_CLIENT_ID}}
        XRAY_CLIENT_SECRET: ${{SECRET_XRAY_CLIENT_SECRET}}
        # Extra root CA for Node's TLS trust store. The path is machine-specific,
        # so it is set in env/.env.local (gitignored) and this line only carries
        # it through to .localConfigs, where env-cmd puts it into the process
        # environment before Node starts. Empty on machines that do not need it,
        # which Node ignores. See env/.env.local for why it exists.
        NODE_EXTRA_CA_CERTS: ${{NODE_EXTRA_CA_CERTS}}
        # The dev-tunnel URL, written by the "Start local tunnel" debug task.
        # config.ts derives the GitHub OAuth callback URL from this, so it has to
        # reach the running process -- and because the tunnel hostname changes
        # each time the tunnel is recreated, the new callback URL has to be added
        # to the GitHub App before sign-in will work again.
        BOT_ENDPOINT: ${{BOT_ENDPOINT}}
